components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A JWT issued by the account’s OAuth server, sent in the `Authorization` header.
  schemas:
    Booking:
      type: object
      required:
        - id
        - venueId
        - status
        - partySize
        - arrivesAt
      properties:
        id:
          type: string
          description: ULID
        venueId:
          type: string
          description: ULID
        customer:
          $ref: "#/components/schemas/Customer"
        status:
          type: string
          enum:
            - held
            - pending
            - confirmed
            - cancelled
        partySize:
          type: integer
          minimum: 1
          maximum: 20
        arrivesAt:
          type: string
          format: date-time
        lines:
          type: array
          items:
            $ref: "#/components/schemas/BookingLine"
        notes:
          type: string
          maxLength: 500
        createdAt:
          type: string
          format: date-time
          readOnly: true
    BookingCreate:
      type: object
      required:
        - venueId
        - holdId
        - partySize
        - customer
      properties:
        venueId:
          type: string
          description: ULID
          example: 01J8QW
        holdId:
          type: string
          description: Expires after 10 min
          example: h_92k
        partySize:
          type: integer
          minimum: 1
          maximum: 20
          example: 4
        customer:
          $ref: "#/components/schemas/Customer"
        notes:
          type: string
          maxLength: 500
    BookingLine:
      type: object
      required:
        - productCode
        - quantity
      properties:
        id:
          type: string
          readOnly: true
        productCode:
          type: string
          maxLength: 32
        quantity:
          type: integer
          minimum: 1
          maximum: 99
        amountMinor:
          type: integer
          description: Minor units, e.g. pence.
    Venue:
      type: object
      required:
        - name
        - timezone
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
          maxLength: 120
        timezone:
          type: string
          example: Europe/London
        address:
          type: string
          maxLength: 240
        capacity:
          type: integer
          minimum: 1
    AvailabilitySlot:
      type: object
      required:
        - slotId
        - startsAt
        - seats
      properties:
        slotId:
          type: string
        startsAt:
          type: string
          format: date-time
        seats:
          type: integer
          minimum: 1
          maximum: 20
        tableId:
          type: string
    Customer:
      type: object
      required:
        - name
        - email
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
          maxLength: 120
          example: A. Rae
        email:
          type: string
          example: a@rae.dev
        phone:
          type: string
          maxLength: 24
        marketingConsent:
          type: boolean
          default: false
    Payment:
      type: object
      required:
        - bookingId
        - amountMinor
        - currency
      properties:
        id:
          type: string
          readOnly: true
        bookingId:
          type: string
        amountMinor:
          type: integer
          minimum: 1
        currency:
          type: string
          enum:
            - GBP
            - EUR
            - USD
        status:
          type: string
          enum:
            - authorised
            - captured
            - refunded
            - voided
          readOnly: true
        metadata:
          type: object
    WebhookSubscription:
      type: object
      required:
        - url
        - events
      properties:
        id:
          type: string
          readOnly: true
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
            enum:
              - booking.created
              - booking.cancelled
              - payment.captured
        secret:
          type: string
          writeOnly: true
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: hold_expired
        message:
          type: string
        details:
          type: array
          items:
            type: object
