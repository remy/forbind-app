<aw-app></aw-app>

<noscript>
  <div class="noscript">
    <h1>allyway needs JavaScript</h1>
    <p>
      allyway parses your OpenAPI schema in the browser — there is no server doing it for you,
      which is what lets it promise that the file never leaves your machine. That means it cannot
      work with scripting turned off. If that is a blocker for you, the schema you were about to
      load is still a plain text file, and every part of it that allyway would show you is in there.
    </p>
  </div>
</noscript>
